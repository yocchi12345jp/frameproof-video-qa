name: Bug report
description: Report a reproducible defect or false result
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FrameProof version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node.js version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include command, configuration, and a minimal shareable frame sequence when possible.
    validations:
      required: true
